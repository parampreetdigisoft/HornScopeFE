<section class="hs_before_login hs_auth_page">
  <div class="hs_before_login_cards ami_auth_card ami_auth_card--narrow">
    <figure class="hs_logo">
      <a>
        <img src="assets/images/Logo-hornscope-large.png" alt="Hornscope" width="100" height="100" />
      </a>
    </figure>

    <div class="ami_auth_icon_badge" aria-hidden="true">
      <i class="bi bi-check2-circle"></i>
    </div>

    <h4 class="before_login_card_head text-center">{{ title }}</h4>
    <p class="before_login_card_desc text-center">
      {{ text }}
    </p>

    <button type="button" (click)="onSubmit()" class="common_button w-100 mt-3">
      <i class="bi bi-box-arrow-in-right"></i> {{ buttonText || 'Log In' }}
    </button>
  </div>
</section>
