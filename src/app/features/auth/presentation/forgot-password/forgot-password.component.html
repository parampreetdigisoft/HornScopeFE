<section class="vui_before_login vui_auth_page" *ngIf="!isSuccess">
  <div class="vui_before_login_cards ami_auth_card ami_auth_card--narrow">
    <figure class="vui_logo">
      <a><img src="assets/images/Logo-market-large.png" alt="Africa Market Intelligence"></a>
    </figure>

    <div class="ami_auth_icon_badge" aria-hidden="true">
      <i class="bi bi-key"></i>
    </div>

    <h4 class="before_login_card_head text-center">Forgot password</h4>
    <p class="before_login_card_desc text-center">
      Enter your email and we’ll send a reset link.
    </p>

    <form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
      <div class="input_field mb-0">
        <label for="forgotEmail"><i class="bi bi-envelope"></i> Email *</label>
        <input id="forgotEmail" type="email" name="username" [(ngModel)]="email" required
          placeholder="name@example.com" class="form-control" #emailRef="ngModel" autocomplete="email" />

        <div *ngIf="emailRef.invalid && emailRef.touched" class="error-msg">
          <span *ngIf="emailRef.errors?.['required']">Email is required.</span>
          <span *ngIf="emailRef.errors?.['email']">Invalid email format.</span>
        </div>
      </div>

      <button type="submit" class="common_button w-100 mt-3" [disabled]="myForm.invalid">
        <i class="bi bi-send"></i> Send reset link
        <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
      </button>

      <div class="text-center mt-3">
        <a [routerLink]="['/auth/clientPortalLogin']" class="vui_reset_pass_link">
          <i class="bi bi-arrow-left"></i> Back to log in
        </a>
      </div>
    </form>
  </div>
</section>

<app-account-pop-up *ngIf="isSuccess"
  (event)="popUpEvent()"
  [title]="'Email Sent'"
  [text]="'A password reset link has been sent to your email.'"
  [buttonText]="'Go to Log In'">
</app-account-pop-up>
