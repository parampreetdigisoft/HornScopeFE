<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <section class="vui_before_login vui_auth_page">
    <div class="vui_before_login_cards ami_auth_card ami_auth_card--narrow">
      <figure class="vui_logo">
        <a><img src="assets/images/Logo-market-large.png" alt="Africa Market Intelligence"></a>
      </figure>

      <div class="ami_auth_icon_badge" aria-hidden="true">
        <i class="bi bi-box-arrow-in-right"></i>
      </div>

      <h4 class="before_login_card_head text-center">
        Welcome{{ role == '3' ? ' back' : '' }}
      </h4>
      <p class="before_login_card_desc text-center">
        {{ role == '3' ? 'Your market intelligence copilot for national insights.' : 'Sign in to continue to AMI.' }}
      </p>

      <div class="input_field">
        <label for="loginEmail"><i class="bi bi-envelope"></i> Email *</label>
        <input id="loginEmail" type="email" formControlName="email" placeholder="name@example.com" class="form-control" autocomplete="username">
        <div *ngIf="(email?.touched || (email?.invalid && isSubmitted))" class="error-msg">
          <div *ngIf="email?.errors?.['required']">Email is required.</div>
          <div *ngIf="email?.errors?.['email']">Please enter a valid email address.</div>
        </div>
      </div>

      <div class="input_field password_eye mb-2">
        <label for="loginPassword"><i class="bi bi-lock"></i> Password *</label>
        <div class="position-relative">
          <input id="loginPassword" type="password" formControlName="password" placeholder="Enter password"
            class="form-control" #password autocomplete="current-password">
          <button type="button" class="password_eye_icon" tabindex="-1"
            [attr.aria-label]="password.type === 'password' ? 'Show password' : 'Hide password'"
            (click)="password.type = password.type === 'password' ? 'text' : 'password'">
            <i class="bi" [ngClass]="password.type === 'password' ? 'bi-eye' : 'bi-eye-slash'"></i>
          </button>
        </div>
        <div *ngIf="(loginForm.get('password')?.touched || isSubmitted) && loginForm.get('password')?.hasError('required')"
          class="error-msg">
          Password is required
        </div>
      </div>

      <div class="row g-2 align-items-center">
        <div class="col">
          <div class="vui_checkbox">
            <div class="form-check">
              <input class="form-check-input" formControlName="rememberMe" type="checkbox" id="flexCheckChecked">
              <label class="form-check-label" for="flexCheckChecked">Remember me</label>
            </div>
          </div>
        </div>
        <div class="col-auto">
          <a [routerLink]="['/auth/forgot-password']" class="vui_reset_pass_link">
            <i class="bi bi-key"></i> Forgot password?
          </a>
        </div>
      </div>

      <button type="submit" class="common_button w-100 mt-3" [disabled]="loading">
        <i class="bi bi-box-arrow-in-right"></i> Log In
        <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
      </button>

      <div class="text-center" *ngIf="role == '3'">
        <a [routerLink]="['/auth/sign-up']" class="create_new_account vui_reset_pass_link d-inline-block mt-2">
          <i class="bi bi-person-plus"></i> Create account
        </a>
      </div>
    </div>
  </section>
</form>
