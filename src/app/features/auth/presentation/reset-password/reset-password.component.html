<ng-container *ngIf="!isSuccess">
  <section class="vui_before_login vui_auth_page">
    <div class="vui_before_login_cards ami_auth_card ami_auth_card--narrow">
      <figure class="vui_logo">
        <a><img src="assets/images/Logo-market-large.png" alt="Africa Market Intelligence"></a>
      </figure>

      <div class="ami_auth_icon_badge" aria-hidden="true">
        <i class="bi bi-shield-lock"></i>
      </div>

      <h4 class="before_login_card_head text-center">Reset password</h4>
      <p class="before_login_card_desc text-center">
        Use at least 8 characters with upper, lower, number &amp; symbol.
      </p>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
        <div class="input_field password_eye mb-2">
          <label for="resetPassword"><i class="bi bi-lock"></i> New password *</label>
          <div class="position-relative">
            <input id="resetPassword" type="password" formControlName="password" placeholder="New password"
              class="form-control" #password autocomplete="new-password" style="appearance: none !important;">
            <button type="button" class="password_eye_icon" tabindex="-1"
              [attr.aria-label]="password.type === 'password' ? 'Show password' : 'Hide password'"
              (click)="password.type = password.type === 'password' ? 'text' : 'password'">
              <i class="bi" [ngClass]="password.type === 'password' ? 'bi-eye' : 'bi-eye-slash'"></i>
            </button>
          </div>
          <div *ngIf="resetPasswordForm.controls['password'].touched">
            <span class="error-msg" *ngIf="resetPasswordForm.controls['password'].hasError('required')">Password is required</span>
            <span class="error-msg" *ngIf="resetPasswordForm.controls['password'].hasError('minlength')">Minimum eight characters.</span>
            <span class="error-msg" *ngIf="resetPasswordForm.controls['password'].hasError('pattern')">
              Need upper, lower, number and special character.
            </span>
          </div>
        </div>

        <div class="input_field mb-0">
          <label for="confirmPassword"><i class="bi bi-lock-fill"></i> Confirm password *</label>
          <input id="confirmPassword" class="form-control" type="password" placeholder="Confirm password"
            formControlName="confirmPassword" autocomplete="new-password">
          <span class="error-msg"
            *ngIf="resetPasswordForm.controls['confirmPassword'].hasError('confirmPasswordValidator')">Password mismatch</span>
          <div *ngIf="resetPasswordForm.controls['confirmPassword'].touched">
            <span class="error-msg" *ngIf="resetPasswordForm.controls['confirmPassword'].hasError('required')">
              Confirm password is required
            </span>
          </div>
        </div>

        <button type="submit" class="common_button w-100 mt-3">
          <i class="bi bi-check2-circle"></i> Update password
          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        </button>
      </form>
    </div>
  </section>
</ng-container>

<ng-container *ngIf="isSuccess">
  <app-account-pop-up (event)="popUpEvent()" [title]="'Password Changed'"
    [text]="'Your password has been successfully reset. Please login with your new password.'"></app-account-pop-up>
</ng-container>
