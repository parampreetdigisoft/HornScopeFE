<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-body">
      <button type="button" (click)="closeModel()" class="btn-close" data-bs-dismiss="modal"
        aria-label="Close"></button>
      <div class="row align-items-start profile-modal-header">
        <div class="col-md">
          <h4 class="modal_head">Update Profile</h4>
          <p class="modal_sub_head">Enter the details and marked</p>
        </div>
        <div class="col-md-auto">
          <img
            [src]="userinfo?.profileImagePath ? urlBase+userinfo?.profileImagePath : 'assets/images/default-profile.png'"
            class="pp_pic" (error)="onImgError($event)" [alt]="'Profile Image'" />
        </div>
      </div>
      <div class="modal_tabs">
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="input_field">
            <label>Full Name *</label>
            <input type="text" formControlName="fullName" appAlphaOnly placeholder="Enter Full Name"
              class="form-control" />
            <div class="error-msg" *ngIf="
                userForm.get('fullName')?.invalid &&
                (userForm.get('fullName')?.touched || isSubmitted)
              ">
              Full name is required.
            </div>
          </div>
          <div class="input_field">
            <label>Email *</label>
            <input type="email" formControlName="email" class="form-control" />
            <div class="error-msg" *ngIf="userForm.get('email')?.touched || isSubmitted">
              <span *ngIf="userForm.get('email')?.errors?.['required']">Email is required.</span>
              <span *ngIf="userForm.get('email')?.errors?.['email']">Invalid email format.</span>
              <span *ngIf="userForm.get('email')?.errors?.['emailExists']">Email is already taken.</span>
            </div>
          </div>
          <div class="input_field">
            <label>Phone No. *</label>
            <input type="text" formControlName="phone" placeholder="Enter Phone Number"
              class="form-control" minlength="10" maxlength="15" (keypress)="numberOnly($event)" />
            <div class="error-msg" *ngIf="
                userForm.get('phone')?.invalid &&
                (userForm.get('phone')?.touched || isSubmitted)
              ">
              Phone number is required.
            </div>
          </div>

          <div class="row g-3 image-row">
            <div [class]="selectedImage ? 'col-md-8' : 'col-12'">
              <div class="input_field mb-0">
                <label>Choose Image</label>
                <label class="image-file-picker">
                  <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)"
                    class="image-file-input-hidden">
                  <span class="image-file-trigger">Choose File</span>
                  <span class="image-file-name">{{ selectedFileName }}</span>
                </label>
              </div>
            </div>
            <div class="col-md-4" *ngIf="selectedImage">
              <div class="input_field text-center mb-0 preview-field">
                <label>Preview Image</label>
                <div class="preview-wrap">
                  <img [src]="selectedImage" class="pp_pic preview-pic" (error)="onImgError($event)"
                    [alt]="'Preview Image'" />
                </div>
              </div>
            </div>
          </div>

          <div class="input_field twofa-field">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="is2FAEnabled" formControlName="is2FAEnabled" />
              <label class="form-check-label" for="is2FAEnabled">
                Enable Two-Factor Authentication
              </label>
            </div>
            <small class="d-block auth_text">
              When enabled, you’ll receive an OTP on your registered email during login.
            </small>
          </div>
          <button type="submit" class="common_button w-100 mt-4" [disabled]="userForm.invalid">
            {{ "Update" }}
            <span *ngIf="loading" class="spinner-border spinner-border-sm ms-2"></span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
